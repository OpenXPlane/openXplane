name: release
on:
  push:
    branches: [main]
    paths-ignore: ['site/**', 'docs/**', 'research/**', 'assets/**', '*.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: true
jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest, exe: openxplane }
          - { name: macos-arm64, os: macos-latest, exe: openxplane }
          - { name: windows-x64, os: windows-latest, exe: openxplane.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - name: Package
        shell: bash
        run: |
          version="0.1.${{ github.run_number }}"
          dir="openXplane-$version-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/release/${{ matrix.exe }}" README.md LICENSE "$dir/"
          cp -r examples "$dir/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$dir.zip" "$dir"
          else
            zip -r "$dir.zip" "$dir"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: openXplane-*.zip
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create nightly dist/*.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Nightly build ${{ github.run_number }}" \
            --notes "Automatic build of commit ${GITHUB_SHA::7}. openXplane needs an original copy of X-Plane 12 and contains no game content. Early stage: see the README for what works."
