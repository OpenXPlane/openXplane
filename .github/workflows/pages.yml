name: pages
on:
  push:
    branches: [main]
    paths: [site/**, docs/**, research/*.md, README.md, CHANGELOG.md, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect documents next to the site
        run: |
          mkdir -p site/docs/research
          cp README.md CHANGELOG.md docs/*.md docs/*.json site/docs/
          cp research/*.md site/docs/research/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
