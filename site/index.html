    <div class="card card-warning elevation-2">

        <p>openXplane contains <b>no game content</b>. It reads the aircraft, models, airfoils and
        airports of an installed copy of X-Plane&nbsp;12 and never modifies its files.</p>
      </div>
    </div>

    <h2 class="section-title">What is openXplane?</h2>
    <p class="lead">openXplane is a project to recreate the flight simulator <b>X-Plane&nbsp;12</b> from the ground up in
    <b>Rust</b>. Content formats - ACF aircraft, OBJ8 models, AFL airfoils, apt.dat airports - are read the same way as
    in the original, and behaviour is confirmed by analysing the reference build and comparing against it. Underneath
    is a new engine: 64-bit, a modern renderer, none of the limits of a 32-bit process.</p>

    <figure class="shot elevation-2">
      <img src="assets/cessna.png" alt="Cessna 172 SP in the openXplane viewer (wgpu, Metal)" loading="lazy">
      <figcaption>The Cessna 172 SP from X-Plane 12 in the openXplane viewer: wgpu, Metal. Static pose, no simulation.</figcaption>
    </figure>

    <figure class="shot elevation-2">
      <img src="assets/ksea.png" alt="Cessna 172 SP on runway 16L at Seattle-Tacoma, drawn from apt.dat" loading="lazy">
      <figcaption>Seattle-Tacoma (KSEA) built from the original <code>apt.dat</code>: runways, taxiways, aprons with holes, and the Cessna on 16L.</figcaption>
    </figure>

    <figure class="shot elevation-2">
      <img src="assets/anim/takeoff.gif" alt="Animation: the Cessna 172 takes off from Seattle-Tacoma (chase camera)" loading="lazy">
      <figcaption>Takeoff from KSEA with the approximate flight model (chase camera). More in the <a href="#/gallery">gallery</a>.</figcaption>
    </figure>

    <figure class="shot elevation-2">
      <img src="assets/flight.png" alt="The Cessna 172 climbing out of Seattle-Tacoma with the approximate flight model" loading="lazy">
      <figcaption>Flying the Cessna out of KSEA with the approximate flight model: wing elements use the airfoil code verified against the original. Not the original's flight model.</figcaption>
    </figure>

    <div class="grid">
      <div class="card elevation-1"><span class="material-icons card-icon">verified</span><h3>1:1 with the original</h3><p>Every step is confirmed by analysing the reference build and comparing against it. Unknowns are not guessed.</p></div>
      <div class="card elevation-1"><span class="material-icons card-icon">lock_open</span><h3>No original code or assets</h3><p>Nothing from the original is copied. Formats are described in our own words in the <a href="#/doc/ARCHITECTURE">documentation</a>.</p></div>
      <div class="card elevation-1"><span class="material-icons card-icon">speed</span><h3>A modern engine</h3><p>Rust and wgpu: Metal, Vulkan, DirectX&nbsp;12. 64-bit, multithreaded content loading.</p></div>
      <div class="card elevation-1"><span class="material-icons card-icon">flight</span><h3>Airfoil aerodynamics</h3><p>34 AFL airfoils: table lookup, stall with hysteresis, buffet and regime blending. <a href="#/doc/research/PROFILE_PIPELINE">Details</a></p></div>
      <div class="card elevation-1"><span class="material-icons card-icon">view_in_ar</span><h3>Fly the Cessna</h3><p>Take off from the airport scene with an approximate flight model (not the original's) and fly it with the keyboard.</p></div>
      <div class="card elevation-1"><span class="material-icons card-icon">flight_takeoff</span><h3>Airports</h3><p>Streaming parser for the 380&nbsp;MB <code>apt.dat</code>, with runways and pavement outlines drawn as a ground scene.</p></div>
      <div class="card elevation-1"><span class="material-icons card-icon">data_object</span><h3>Datarefs</h3><p>A typed registry that preserves the original's float32 behaviour.</p></div>
      <div class="card elevation-1"><span class="material-icons card-icon">description</span><h3>Open research</h3><p>Every subsystem is written up in <code>research/</code> notes with addresses and the limits of what is known.</p></div>
    </div>
  </div>

<template id="download">
  <div class="content">
    <h1>Install</h1>
    <div class="card elevation-2">
      <span class="material-icons card-icon">download</span>
      <div><h3>Nightly builds</h3>
      <p>Every change to <code>main</code> is built for Linux (x64), macOS (Apple silicon) and Windows (x64) and
      published as the rolling <a id="nightly-link" href="#">nightly release</a>. Unpack the archive and run
      <code>openxplane</code> from a terminal; there is no launcher yet.</p></div>
    </div>
    <div class="card card-warning elevation-2">
      <span class="material-icons card-icon">warning</span>
      <div><h3>You need the original X-Plane&nbsp;12</h3>
      <p>The builds contain no game content. Place or link your X-Plane&nbsp;12 installation as
      <code>Xplane12/</code> in the folder you run from, or pass its path to the commands.</p></div>
    </div>
    <h2>Run</h2>
    <pre><code>openxplane inspect Xplane12
openxplane fly Xplane12 KSEA "Xplane12/Aircraft/Laminar Research/Cessna 172 SP/Cessna_172SP.acf"
openxplane airport-render Xplane12 KSEA "Xplane12/Aircraft/Laminar Research/Cessna 172 SP/Cessna_172SP.acf" ksea.png</code></pre>
    <p>The standard installation layout and the flat layout used in the provided test data are both accepted. Keys
      are in the <a href="#/doc/KEYBOARD">keyboard reference</a>; all commands in the <a href="#/doc/README">README</a>.</p>
    <h2>Build from source</h2>
    <ul>
      <li>The latest <a href="https://rustup.rs">Rust stable</a>.</li>
    </ul>
    <pre><code>cargo build --release
cargo test</code></pre>
    <p>Tests that need the original installation skip themselves when <code>Xplane12/</code> is absent.</p>
  </div>
</template>
